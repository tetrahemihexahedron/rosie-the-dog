{{ $data := dict }}

{{ if .Args }}
  {{ $data = index .Args 0 }}
{{ end }}

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {{ $assets := readFile "asset-manifest.json" | fromJson }}
  <link rel="stylesheet" href="{{ index $assets "css" }}">

  <title>{{ or $data.title "Rosie the Dog" }}</title>
</head>
